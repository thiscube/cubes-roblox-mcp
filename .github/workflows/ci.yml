name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit   # test/run.mjs — never a glob, see that file
        env:
          # Unit tests answer API-reference questions from a fixture. This makes a
          # stray network read fail the build instead of passing quietly on CI's
          # connection and then failing on someone's laptop.
          CUBES_MCP_OFFLINE: "1"
